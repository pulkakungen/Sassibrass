name = "sassibrass-push"
main = "src/worker.js"
compatibility_date = "2026-01-01"

# Skapas med: npx wrangler kv namespace create PUSH_KV
# Klistra in det "id" som kommandot skriver ut här:
kv_namespaces = [
  { binding = "PUSH_KV", id = "08b642d11eb44a78a799663381590cdd" }
]

# Kör var 15:e minut, dygnet runt (worker-koden filtrerar själv på svensk lokaltid)
[triggers]
# Ett enda schema: var 15:e minut för notiserna, plus varje timme :58 så att
# 23.58 svensk tid alltid träffas, då dagens rad skrivs till kalkylarket.
# Workern filtrerar själv på svensk lokaltid. Ett schema per app håller oss
# under gratisplanens gräns på fem cron-scheman per konto.
crons = ["0,15,30,45,58 * * * *"]

# Hemligheter (sätts med `npx wrangler secret put <NAMN>`, skrivs ALDRIG i denna fil):
#   VAPID_PRIVATE_KEY
#   VAPID_PUBLIC_KEY
#   VAPID_SUBJECT   (t.ex. "mailto:din@epost.se")
