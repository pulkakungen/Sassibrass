<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
<title>Frallan 🦊🐦</title>
<meta name="theme-color" content="#cdeec0" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
<!-- Gör att appen startar utan Safaris adressfält när Olle lägger den på hemskärmen. -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Frallan" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="leaves-bg" aria-hidden="true"></div>

<!-- ================= STARTSKÄRM ================= -->
<section id="screen-start" class="screen active">
  <div class="card start-card">
    <h1 class="app-title">Frallan <span class="wiggle">🦊🐦</span></h1>
    <p class="subtitle">Välj ett djur!</p>

    <div class="pet-picker">
      <button class="pet-choice" data-pet="kiwi">
        <div class="pet-avatar-preview" data-preview="kiwi"></div>
        <span>Kiwi</span>
      </button>
      <button class="pet-choice" data-pet="fox">
        <div class="pet-avatar-preview" data-preview="fox"></div>
        <span>Räv</span>
      </button>
    </div>

    <p class="subtitle small">Vad heter den?</p>
    <div id="name-suggestions" class="name-suggestions"></div>
    <input id="pet-name-input" class="name-input" type="text" maxlength="12" placeholder="Skriv ett namn ✏️" />

    <button id="start-btn" class="btn-primary" disabled>Kör! 🌟</button>
  </div>
</section>

<!-- ================= APPEN ================= -->
<section id="screen-app" class="screen">

  <header class="topbar">
    <div class="pet-mini">
      <div id="pet-avatar" class="pet-avatar"></div>
      <div class="pet-info">
        <div class="pet-name-row">
          <span id="pet-name-display" class="pet-name"></span>
          <span id="pet-level" class="pet-level">Nivå 1</span>
        </div>
        <div class="stat-bar">
          <span class="stat-icon">⭐</span>
          <div class="bar"><div id="xp-fill" class="bar-fill xp"></div></div>
        </div>
        <div class="stat-bar">
          <span id="hunger-icon" class="stat-icon">🐛</span>
          <div class="bar"><div id="hunger-fill" class="bar-fill hunger"></div></div>
        </div>
        <div class="stat-bar">
          <span class="stat-icon">💚</span>
          <div class="bar"><div id="happiness-fill" class="bar-fill happiness"></div></div>
        </div>
      </div>
    </div>
    <div class="topbar-right">
      <div id="demo-badge" class="demo-badge" hidden>DEMO</div>
      <div class="streak-chip">🔥 <span id="streak-count">0</span></div>
      <button id="reset-btn" class="icon-btn" title="Börja om">⚙️</button>
    </div>
  </header>

  <div class="pet-stage">
    <div class="pet-avatar-row">
      <div id="pet-size-wrap" class="pet-size-wrap">
        <div id="pet-avatar-big" class="pet-avatar-big"></div>
      </div>
      <div id="baby-avatar-wrap" class="baby-avatar-wrap" hidden>
        <div id="baby-avatar" class="baby-avatar"></div>
        <span id="baby-name-tag" class="baby-name-tag"></span>
      </div>
    </div>
    <div id="pet-bubble" class="pet-speech-bubble">Hej! 👋</div>
    <div class="feed-buttons">
      <button id="feed-btn" class="feed-btn">
        <span id="feed-emoji">🐛</span> Mat <span id="food-count" class="count-badge">0</span>
      </button>
      <button id="love-btn" class="feed-btn love">
        💚 Kram <span id="love-count" class="count-badge">0</span>
      </button>
    </div>
  </div>

  <main id="task-sections" class="task-sections"></main>

  <div class="daily-progress">
    <div class="daily-progress-label">
      <span>Idag</span>
      <span id="daily-progress-text">0 / 0</span>
    </div>
    <div class="bar big"><div id="daily-progress-fill" class="bar-fill daily"></div></div>
  </div>

</section>

<div id="toast-layer"></div>
<div id="confetti-layer"></div>

<script src="app.js"></script>
</body>
</html>
